# ==============================================================
# SecureHub - DevSecOps CI/CD Pipeline
# ==============================================================
# Triggers:
#   - Every branch push
#   - Every branch pull request
#
# Flow:
# Validate
#   → SAST
#   → SCA
#   → IaC Scan
#   → Dockerfile Lint
#   → Build Images
#   → Trivy Container Scan
#   → Push Verified Images to GHCR (devops only)
#   → Update Kubernetes Manifest (devops only)
# ==============================================================

name: SecureHub DevSecOps Pipeline


on:
  push:
    branches: ["*"]

  pull_request:
    branches: ["*"]


# ==============================================================
# Default Permissions
# ==============================================================

permissions:
  contents: read


# ==============================================================
# Global Environment
# ==============================================================

env:
  REGISTRY: ghcr.io


jobs:

  # ============================================================
  # STAGE 1: Application Validation
  # ============================================================

  validate:
    name: Validate Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      # --------------------------------------------------------
      # Backend Validation
      # --------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install backend dependencies
        working-directory: BackEnd
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Validate backend Python
        working-directory: BackEnd
        run: |
          python -m compileall .


      # --------------------------------------------------------
      # Frontend Validation
      # --------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: FrontEnd/package-lock.json


      - name: Install frontend dependencies
        working-directory: FrontEnd
        run: npm ci


      - name: Build frontend
        working-directory: FrontEnd
        run: npm run build


  # ============================================================
  # STAGE 2: SAST - Semgrep
  # ============================================================

  sast:
    name: Semgrep SAST
    runs-on: ubuntu-latest

    needs:
      - validate

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep


      - name: Run Semgrep
        run: |
          semgrep scan \
            --config=auto \
            --error \
            BackEnd \
            FrontEnd/src


  # ============================================================
  # STAGE 3: SCA - Dependency Security
  # ============================================================

  sca:
    name: Dependency Security
    runs-on: ubuntu-latest

    needs:
      - validate

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      # --------------------------------------------------------
      # Python / Backend SCA
      # --------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit


      - name: Scan Python dependencies
        run: |
          pip-audit -r BackEnd/requirements.txt


      # --------------------------------------------------------
      # JavaScript / Frontend SCA
      # --------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: FrontEnd/package-lock.json


      - name: Install frontend dependencies
        working-directory: FrontEnd
        run: npm ci


      - name: Scan frontend dependencies
        working-directory: FrontEnd
        run: |
          npm audit --audit-level=high


  # ============================================================
  # STAGE 4: Infrastructure-as-Code Security
  # ============================================================

  iac-scan:
    name: Checkov IaC Scan
    runs-on: ubuntu-latest

    needs:
      - validate

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      # --------------------------------------------------------
      # Terraform Scan
      # --------------------------------------------------------

      - name: Scan Terraform
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          soft_fail: false
          output_format: cli
          quiet: true
          compact: true
          download_external_modules: false
          skip_check: CKV_TF_1


      # --------------------------------------------------------
      # Kubernetes Scan
      # --------------------------------------------------------

      - name: Scan Kubernetes
        uses: bridgecrewio/checkov-action@v12
        with:
          file: k8s/securehub.yml
          framework: kubernetes
          soft_fail: false
          output_format: cli


  # ============================================================
  # STAGE 5: Dockerfile Lint
  # ============================================================

  dockerfile-lint:
    name: Dockerfile Lint - ${{ matrix.component }}
    runs-on: ubuntu-latest

    needs:
      - validate

    strategy:
      matrix:
        include:

          - component: backend
            dockerfile: BackEnd/Dockerfile

          - component: frontend
            dockerfile: FrontEnd/Dockerfile


    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          failure-threshold: error


  # ============================================================
  # STAGE 6: Docker Image Build
  #
  # Images are built only after all previous security and
  # validation stages pass.
  # ============================================================

  build:
    name: Build ${{ matrix.component }} Image
    runs-on: ubuntu-latest

    needs:
      - sast
      - sca
      - iac-scan
      - dockerfile-lint

    strategy:
      matrix:
        include:

          - component: backend
            context: ./BackEnd
            image_name: securehub-backend

          - component: frontend
            context: ./FrontEnd
            image_name: securehub-frontend


    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      # --------------------------------------------------------
      # Normalize GitHub owner for GHCR
      #
      # Container registry image names must be lowercase.
      # --------------------------------------------------------

      - name: Normalize registry owner
        id: registry
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"

          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"


      # --------------------------------------------------------
      # Build
      # --------------------------------------------------------

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ steps.registry.outputs.owner }}/${{ matrix.image_name }}:${{ github.sha }} \
            ${{ matrix.context }}


      # --------------------------------------------------------
      # Save image so the next job can scan the exact same image
      # --------------------------------------------------------

      - name: Save Docker image
        run: |
          docker save \
            ${{ env.REGISTRY }}/${{ steps.registry.outputs.owner }}/${{ matrix.image_name }}:${{ github.sha }} \
            -o /tmp/${{ matrix.component }}.tar


      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.component }}-image
          path: /tmp/${{ matrix.component }}.tar
          retention-days: 1


  # ============================================================
  # STAGE 7: Container Security - Trivy
  #
  # CRITICAL/HIGH findings fail the pipeline.
  #
  # Images are NOT pushed to GHCR until this stage passes.
  # ============================================================

  image-scan:
    name: Trivy Scan - ${{ matrix.component }}
    runs-on: ubuntu-latest

    needs:
      - build

    strategy:
      matrix:
        include:

          - component: backend
            image_name: securehub-backend

          - component: frontend
            image_name: securehub-frontend


    steps:

      # --------------------------------------------------------
      # Download previously-built image
      # --------------------------------------------------------

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.component }}-image
          path: /tmp/image


      - name: Load Docker image
        run: |
          docker load \
            -i /tmp/image/${{ matrix.component }}.tar


      - name: Normalize registry owner
        id: registry
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"

          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"


      # --------------------------------------------------------
      # Trivy Security Gate
      # --------------------------------------------------------

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:

          image-ref: >-
            ${{ env.REGISTRY }}/${{ steps.registry.outputs.owner }}/${{ matrix.image_name }}:${{ github.sha }}

          format: table

          vuln-type: os,library

          severity: CRITICAL,HIGH

          ignore-unfixed: true

          exit-code: "1"


  # ============================================================
  # STAGE 8: Publish Verified Images
  #
  # Security scans run on EVERY branch.
  #
  # Images are published only from devops.
  # PRs and other branches never publish packages.
  # ============================================================

  publish:
    name: Publish ${{ matrix.component }} to GHCR
    runs-on: ubuntu-latest

    needs:
      - image-scan

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/devops'

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:

          - component: backend
            image_name: securehub-backend

          - component: frontend
            image_name: securehub-frontend


    steps:

      # --------------------------------------------------------
      # Retrieve verified image
      # --------------------------------------------------------

      - name: Download verified Docker image
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.component }}-image
          path: /tmp/image


      - name: Load Docker image
        run: |
          docker load \
            -i /tmp/image/${{ matrix.component }}.tar


      - name: Normalize registry owner
        id: registry
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"

          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"


      # --------------------------------------------------------
      # GHCR Authentication
      #
      # No manually-created PAT is required.
      # GitHub provides GITHUB_TOKEN automatically.
      # --------------------------------------------------------

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # --------------------------------------------------------
      # Push only after Trivy passed
      # --------------------------------------------------------

      - name: Push verified image
        run: |
          docker push \
            ${{ env.REGISTRY }}/${{ steps.registry.outputs.owner }}/${{ matrix.image_name }}:${{ github.sha }}


  # ============================================================
  # STAGE 9: Update Kubernetes Manifest
  #
  # Runs after both backend/frontend images have passed security
  # scanning and have been published to GHCR.
  #
  # Only modifies the devops branch.
  # ============================================================

  update-kubernetes:
    name: Update Kubernetes Manifest
    runs-on: ubuntu-latest

    needs:
      - publish

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/devops'

    permissions:
      contents: write


    steps:

      # --------------------------------------------------------
      # Checkout active DevOps branch
      # --------------------------------------------------------

      - name: Checkout devops branch
        uses: actions/checkout@v6
        with:
          ref: devops


      - name: Normalize registry owner
        id: registry
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"

          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"


      # --------------------------------------------------------
      # Build immutable image references
      # --------------------------------------------------------

      - name: Update Kubernetes image tags
        shell: bash
        run: |
          BACKEND_IMAGE="${{ env.REGISTRY }}/${{ steps.registry.outputs.owner }}/securehub-backend:${{ github.sha }}"
          FRONTEND_IMAGE="${{ env.REGISTRY }}/${{ steps.registry.outputs.owner }}/securehub-frontend:${{ github.sha }}"

          sed -i \
            "/securehub-backend/ s|image: .*|image: ${BACKEND_IMAGE}|" \
            k8s/securehub.yml

          sed -i \
            "/securehub-frontend/ s|image: .*|image: ${FRONTEND_IMAGE}|" \
            k8s/securehub.yml


      # --------------------------------------------------------
      # Verify manifest modifications
      # --------------------------------------------------------

      - name: Display image references
        run: |
          grep "image:" k8s/securehub.yml


      # --------------------------------------------------------
      # Automated Manifest Commit
      #
      # [skip ci] prevents the bot commit from starting another
      # complete CI/CD pipeline.
      # --------------------------------------------------------

      - name: Commit Kubernetes manifest update
        shell: bash
        run: |

          if git diff --quiet k8s/securehub.yml; then

            echo "Kubernetes manifest already contains current image tags."

            exit 0

          fi


          git config \
            user.name \
            "github-actions[bot]"


          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add \
            k8s/securehub.yml


          git commit \
            -m "ci: update SecureHub images to ${GITHUB_SHA::7} [skip ci]"


          git push \
            origin HEAD:devops