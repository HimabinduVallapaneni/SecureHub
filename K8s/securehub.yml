# ==============================================================
# SecureHub - Kubernetes Manifest
#
# Contains:
# - Namespace
# - PostgreSQL Storage
# - PostgreSQL
# - Backend
# - Frontend
# - Services
# - Network Policies
#
# IMPORTANT:
# - No passwords or credentials are stored in this file.
# - Database credentials must exist as a Kubernetes Secret
#   named: securehub-db-credentials
# - CI/CD will replace the application image placeholders.
# ==============================================================


# --------------------------------------------------------------
# Namespace
# --------------------------------------------------------------

apiVersion: v1
kind: Namespace
metadata:
  name: securehub
  labels:
    app.kubernetes.io/part-of: securehub


---

# --------------------------------------------------------------
# PostgreSQL Storage Class
#
# Requires the standard Amazon EBS CSI Driver on EKS.
# --------------------------------------------------------------

apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: securehub-ebs
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true


---

# --------------------------------------------------------------
# PostgreSQL Persistent Volume Claim
# --------------------------------------------------------------

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: securehub-db-storage
  namespace: securehub
  labels:
    app.kubernetes.io/name: securehub-db
    app.kubernetes.io/part-of: securehub
    app.kubernetes.io/component: database

spec:
  accessModes:
    - ReadWriteOnce

  storageClassName: securehub-ebs

  resources:
    requests:
      storage: 5Gi


---

# --------------------------------------------------------------
# PostgreSQL Deployment
# --------------------------------------------------------------

apiVersion: apps/v1
kind: Deployment
metadata:
  name: securehub-db
  namespace: securehub

  labels:
    app.kubernetes.io/name: securehub-db
    app.kubernetes.io/part-of: securehub
    app.kubernetes.io/component: database

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: securehub-db

  template:
    metadata:
      labels:
        app.kubernetes.io/name: securehub-db
        app.kubernetes.io/part-of: securehub
        app.kubernetes.io/component: database

    spec:
      automountServiceAccountToken: false

      containers:
        - name: postgres

          image: postgres:16-alpine

          imagePullPolicy: IfNotPresent

          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP

          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: securehub-db-credentials
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: securehub-db-credentials
                  key: POSTGRES_PASSWORD

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: securehub-db-credentials
                  key: POSTGRES_DB

          volumeMounts:
            - name: database-storage
              mountPath: /var/lib/postgresql/data
              subPath: pgdata

          resources:
            requests:
              cpu: 100m
              memory: 256Mi

            limits:
              cpu: 500m
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"

            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"

            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

      volumes:
        - name: database-storage
          persistentVolumeClaim:
            claimName: securehub-db-storage


---

# --------------------------------------------------------------
# PostgreSQL Service
#
# ClusterIP means PostgreSQL is accessible only inside Kubernetes.
# There is no public database endpoint.
# --------------------------------------------------------------

apiVersion: v1
kind: Service
metadata:
  name: securehub-db
  namespace: securehub

  labels:
    app.kubernetes.io/name: securehub-db
    app.kubernetes.io/part-of: securehub
    app.kubernetes.io/component: database

spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: securehub-db

  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP


---

# --------------------------------------------------------------
# SecureHub Backend
#
# IMAGE_PLACEHOLDER is replaced by CI/CD after a verified
# container image is pushed to the registry.
# --------------------------------------------------------------

apiVersion: apps/v1
kind: Deployment
metadata:
  name: securehub-backend
  namespace: securehub

  labels:
    app.kubernetes.io/name: securehub-backend
    app.kubernetes.io/part-of: securehub
    app.kubernetes.io/component: backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: securehub-backend

  template:
    metadata:
      labels:
        app.kubernetes.io/name: securehub-backend
        app.kubernetes.io/part-of: securehub
        app.kubernetes.io/component: backend

    spec:
      automountServiceAccountToken: false

      initContainers:
        - name: wait-for-database

          image: busybox:1.36

          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL..."
              until nc -z securehub-db 5432; do
                sleep 3
              done
              echo "PostgreSQL is ready."

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534

            capabilities:
              drop:
                - ALL

      containers:
        - name: backend

          image: SECUREHUB_BACKEND_IMAGE

          imagePullPolicy: Always

          ports:
            - name: backend-http
              containerPort: 8000
              protocol: TCP

          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: securehub-db-credentials
                  key: POSTGRES_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: securehub-db-credentials
                  key: POSTGRES_PASSWORD

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: securehub-db-credentials
                  key: POSTGRES_DB

            - name: DATABASE_URL
              value: >-
                postgresql://$(DB_USER):$(DB_PASSWORD)@securehub-db:5432/$(DB_NAME)

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true

            capabilities:
              drop:
                - ALL

          readinessProbe:
            httpGet:
              path: /health
              port: backend-http

            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /health
              port: backend-http

            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4


---

# --------------------------------------------------------------
# Backend Service
#
# Backend stays internal to the Kubernetes cluster.
# --------------------------------------------------------------

apiVersion: v1
kind: Service
metadata:
  name: securehub-backend
  namespace: securehub

  labels:
    app.kubernetes.io/name: securehub-backend
    app.kubernetes.io/part-of: securehub
    app.kubernetes.io/component: backend

spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: securehub-backend

  ports:
    - name: http
      port: 8000
      targetPort: backend-http
      protocol: TCP


---

# --------------------------------------------------------------
# SecureHub Frontend
#
# IMAGE_PLACEHOLDER is replaced by CI/CD after a verified
# container image is pushed to the registry.
# --------------------------------------------------------------

apiVersion: apps/v1
kind: Deployment
metadata:
  name: securehub-frontend
  namespace: securehub

  labels:
    app.kubernetes.io/name: securehub-frontend
    app.kubernetes.io/part-of: securehub
    app.kubernetes.io/component: frontend

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: securehub-frontend

  template:
    metadata:
      labels:
        app.kubernetes.io/name: securehub-frontend
        app.kubernetes.io/part-of: securehub
        app.kubernetes.io/component: frontend

    spec:
      automountServiceAccountToken: false

      containers:
        - name: frontend

          image: SECUREHUB_FRONTEND_IMAGE

          imagePullPolicy: Always

          ports:
            - name: frontend-http
              containerPort: 80
              protocol: TCP

          resources:
            requests:
              cpu: 50m
              memory: 64Mi

            limits:
              cpu: 250m
              memory: 256Mi

          securityContext:
            allowPrivilegeEscalation: false

            capabilities:
              drop:
                - ALL

          readinessProbe:
            httpGet:
              path: /
              port: frontend-http

            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /
              port: frontend-http

            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4


---

# --------------------------------------------------------------
# Frontend Service
#
# ClusterIP intentionally avoids exposing a NodePort.
#
# During development/demo:
#
# kubectl port-forward \
#   -n securehub \
#   service/securehub-frontend \
#   8080:80
#
# External production-style exposure can later be handled
# through an Ingress or AWS Load Balancer.
# --------------------------------------------------------------

apiVersion: v1
kind: Service
metadata:
  name: securehub-frontend
  namespace: securehub

  labels:
    app.kubernetes.io/name: securehub-frontend
    app.kubernetes.io/part-of: securehub
    app.kubernetes.io/component: frontend

spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: securehub-frontend

  ports:
    - name: http
      port: 80
      targetPort: frontend-http
      protocol: TCP


---

# --------------------------------------------------------------
# Network Policy
#
# PostgreSQL accepts application traffic only from backend pods.
# --------------------------------------------------------------

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: database-ingress
  namespace: securehub

spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: securehub-db

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: securehub-backend

      ports:
        - port: 5432
          protocol: TCP


---

# --------------------------------------------------------------
# Network Policy
#
# Backend accepts application traffic only from frontend pods.
# --------------------------------------------------------------

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-ingress
  namespace: securehub

spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: securehub-backend

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: securehub-frontend

      ports:
        - port: 8000
          protocol: TCP